name: Build AutoAlert

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 1) APK de test : ne demande aucune clé
      - name: Compiler l'APK de test
        run: gradle assembleDebug

      - name: Télécharger l'APK de test
        uses: actions/upload-artifact@v4
        with:
          name: AutoAlert-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # 2) AAB signé : seulement si les secrets sont présents
      - name: Préparer la clé de signature
        id: keys
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/AutoAlert.keystore"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Secret KEYSTORE_BASE64 absent : AAB ignoré"
          fi

      - name: Compiler le AAB signé
        if: steps.keys.outputs.ok == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/AutoAlert.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Télécharger le AAB
        if: steps.keys.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AutoAlert-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
